[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    ui: Запускает UI тесты
    smoke: Запускает смоук тесты
    regression: Запускает регрессионные тесты
    slow: Запускает медленные тесты
    registration: Запускает тесты на регистрацию
    critical: Запускает критичные тесты
    authorization: Запускает тесты для авторизацию